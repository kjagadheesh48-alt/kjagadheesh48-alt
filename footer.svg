<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-labelledby="jkFootTitle" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="jkFootTitle">Thanks for visiting</title>
  <defs>
    <linearGradient id="jkFootBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#451126"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="jkFootLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="90" rx="12" fill="url(#jkFootBg)"/>
  <rect x="250" y="26" width="500" height="2" rx="1" fill="url(#jkFootLine)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#E5B5C7" letter-spacing="3">THANKS FOR VISITING</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
