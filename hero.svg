<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="jkHeroTitle jkHeroDesc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="jkHeroTitle">C Jagadheesh Kumar</title>
  <desc id="jkHeroDesc">Software Developer focused on Generative AI, Agentic AI and UI/UX Design</desc>
  <defs>
    <linearGradient id="jkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="jkAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <radialGradient id="jkLight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="jkGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5B5C7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="jkGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="280" rx="14" fill="url(#jkBg)"/>
  <rect width="1000" height="280" rx="14" fill="url(#jkGrid)"/>

  <!-- moving light -->
  <ellipse cx="200" cy="140" rx="260" ry="150" fill="url(#jkLight)">
    <animate attributeName="cx" values="200;780;200" dur="14s" repeatCount="indefinite"/>
  </ellipse>

  <!-- orbital geometry -->
  <g transform="translate(850 140)" fill="none" stroke="#C77B9B" stroke-opacity="0.35">
    <circle r="70"/>
    <circle r="105" stroke-dasharray="3 9"/>
    <circle r="3" cx="70" fill="#E5B5C7" stroke="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" cx="105" fill="#C77B9B" stroke="none">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- flowing path -->
  <path d="M 0 232 C 180 190, 300 270, 480 226 S 800 190, 1000 236" fill="none" stroke="url(#jkAccent)" stroke-width="2" stroke-dasharray="6 10" filter="url(#jkGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- text -->
  <text x="60" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#F8F0F3" letter-spacing="1">C Jagadheesh Kumar</text>
  <text x="62" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#E5B5C7" letter-spacing="2">SOFTWARE DEVELOPER  ·  GENERATIVE AI  ·  AGENTIC AI  ·  UI/UX</text>
  <text x="62" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#C77B9B">Building practical AI software with Python and Java</text>

  <!-- glowing underline -->
  <rect x="62" y="196" width="320" height="3" rx="1.5" fill="url(#jkAccent)" filter="url(#jkGlow)">
    <animate attributeName="width" values="120;320;120" dur="5s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
